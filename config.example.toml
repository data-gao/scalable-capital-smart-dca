# ==============================================================================
# Scalable Capital - Smart / Value-Averaging DCA Configuration
# ==============================================================================

[app]
# Execution mode:
#   "dry-run": Simulation only; calculates indicators, evaluates signals, and
#              displays planned commands without sending requests to broker (Default safe mode).
#   "preview": Runs Phase 1 preview (calls `sc broker savings-plans add` / `trade buy`
#              to fetch ex-ante cost disclosures and confirmation token).
#   "live":    Executes Phase 2 confirmation with actual submission (use with caution).
mode = "dry-run"
state_file = ".smart_dca_state.json"

[safety]
# Global safety and risk limits
max_monthly_budget = 2000.0            # Hard upper limit across all monthly savings plans (EUR)
max_single_trade_amount = 500.0        # Upper limit for an opportunistic dip buy trade (EUR)
opportunistic_buy_cooldown_days = 7    # Cooldown period (days) before a dip buy can trigger again on the same asset

# ------------------------------------------------------------------------------
# Target Assets & Strategy Rules
# ------------------------------------------------------------------------------

# 1. Global Equity: Vanguard FTSE All-World (VWCE)
[[targets]]
isin = "IE00BK5BQT80"
name = "Vanguard FTSE All-World (VWCE)"
base_amount = 400.0                    # Base monthly investment amount (EUR)
execution_day_of_month = 4             # Savings plan execution day (4th of each month)

[targets.overvalued_rule]
enabled = true
condition = "price_above_sma"
sma_period = 200                       # 200-day SMA (or 40-week equivalent)
amount_multiplier = 0.70               # When price > 200 SMA, trim monthly plan to 70% (EUR 280)

[targets.oversold_rule]
enabled = true
condition = "bollinger_lower_or_rsi_oversold"
rsi_period = 14
rsi_threshold = 30.0                   # RSI-14 < 30
bollinger_period = 20
bollinger_std = 2.0                    # Price below lower Bollinger Band (20, 2 std)
action_type = "scale_up_savings_plan"  # "scale_up_savings_plan", "opportunistic_trade_buy", or "both"
savings_plan_multiplier = 1.30         # When dip/oversold is detected, increase savings plan to 130% (EUR 520)
trade_buy_amount = 150.0               # Amount for one-off opportunistic buy trade if enabled (EUR)


# 2. US Market: iShares Core S&P 500
[[targets]]
isin = "IE00B5BMR087"
name = "iShares Core S&P 500"
base_amount = 300.0                    # Base monthly investment (EUR)
execution_day_of_month = 10

[targets.overvalued_rule]
enabled = true
condition = "price_above_sma"
sma_period = 200
amount_multiplier = 0.70               # High valuation: Trim to 70% (EUR 210)

[targets.oversold_rule]
enabled = true
condition = "bollinger_lower_or_rsi_oversold"
rsi_period = 14
rsi_threshold = 30.0
bollinger_period = 20
bollinger_std = 2.0
action_type = "both"                   # Both scale up next plan AND trigger one-off dip buy
savings_plan_multiplier = 1.40         # Scale up to 140% (EUR 420)
trade_buy_amount = 200.0               # One-off buy order of EUR 200


# 3. Developed World: iShares Core MSCI World
[[targets]]
isin = "IE00B4L5Y983"
name = "iShares Core MSCI World"
base_amount = 200.0
execution_day_of_month = 15

[targets.overvalued_rule]
enabled = true
condition = "price_above_sma"
sma_period = 200
amount_multiplier = 0.70

[targets.oversold_rule]
enabled = true
condition = "bollinger_lower_or_rsi_oversold"
rsi_threshold = 30.0
action_type = "scale_up_savings_plan"
savings_plan_multiplier = 1.50         # Scale up to 150% (EUR 300)
