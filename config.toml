# ==============================================================================
# Scalable Capital - 智能价值平均定投器 (Smart / Value-Averaging DCA) 配置
# ==============================================================================

[app]
# 运行模式:
#   "dry-run": 纯模拟计算，输出技术指标、信号与拟执行指令，不调用 Scalable 下单/改计划接口 (默认安全模式)
#   "preview": 执行 Phase 1 预检（调用 sc broker savings-plans add / trade buy 获取事前费用清单和确认 ID）
#   "live":    执行 Phase 2 真实确认提交（需谨慎开启）
mode = "dry-run"
state_file = ".smart_dca_state.json"

[safety]
# 全局安全风控限制
max_monthly_budget = 2500.0            # 所有标的月度定投总额硬上限 (€)
max_single_trade_amount = 500.0        # 单次抄底加仓买入金额上限 (€)
opportunistic_buy_cooldown_days = 7    # 单一标的抄底买入冷却天数（避免连续多天下跌重复全仓抄底）

# ------------------------------------------------------------------------------
# 监控与定投标的 (Targets)
# ------------------------------------------------------------------------------

# 1. S&P 500: Amundi Core S&P 500 Swap EUR (Dist)
[[targets]]
isin = "LU0496786574"
name = "Amundi Core S&P 500"
base_amount = 400.0                    # 基准月定投额 (€400)
execution_day_of_month = 10            # 定投扣款日 (每月10日)

[targets.overvalued_rule]
enabled = true
condition = "price_above_sma"
sma_period = 200                       # 200日均线 (或40周均线)
amount_multiplier = 0.70               # 高于 200 均线（估值偏高）时，定投额下调为 70% (€280)

[targets.oversold_rule]
enabled = true
condition = "bollinger_lower_or_rsi_oversold"
rsi_period = 14
rsi_threshold = 30.0                   # RSI < 30
bollinger_period = 20
bollinger_std = 2.0                    # 布林带下轨 (20, 2σ)
action_type = "scale_up_savings_plan"  # "scale_up_savings_plan" 或 "opportunistic_trade_buy" 或 "both"
savings_plan_multiplier = 1.30         # 击穿下轨或超卖时，调大定投额至 130% (€520)
trade_buy_amount = 100.0               # 若启用一次性抄底买入，单次加仓额 (€)


# 2. 全球股票: Vanguard FTSE All-World (VWCE)
[[targets]]
isin = "IE00BK5BQT80"
name = "Vanguard FTSE All-World (VWCE)"
base_amount = 500.0                    # 基准月定投额 (€500)
execution_day_of_month = 4

[targets.overvalued_rule]
enabled = true
condition = "price_above_sma"
sma_period = 200
amount_multiplier = 0.70               # 高于 200 均线时下调至 70% (€350)

[targets.oversold_rule]
enabled = true
condition = "bollinger_lower_or_rsi_oversold"
rsi_period = 14
rsi_threshold = 30.0
bollinger_period = 20
bollinger_std = 2.0
action_type = "both"                   # 既调大下期定投，又触发一次性抄底买入
savings_plan_multiplier = 1.40         # 调大至 140% (€700)
trade_buy_amount = 200.0               # 一次性抄底买入 €200


